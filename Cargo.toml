[workspace]
resolver = "3"
members = [
    "apps/client",
    "apps/server",
    "apps/dev_hub",
    "crates/common",
    "crates/dev_runtime",
    "crates/simulation",
    "crates/protocol",
    "crates/content",
    "crates/persistence",
    "tools/content_validator",
    "tools/bot_client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[workspace.lints.rust]
# `deny` (not `forbid`) so Phase 5.7 can `allow` a single Win32 Working-Set sample.
unsafe_code = "deny"
