name: One-time branch cleanup 0.11.F

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/cleanup-obsolete-branches.yml"

permissions:
  contents: write

jobs:
  verify-and-clean:
    name: Verify master, then delete obsolete branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain and components
        run: rustup show

      - name: Verify canonical quality gate
        run: |
          chmod +x ./scripts/check.sh
          ./scripts/check.sh

      - name: Delete obsolete branches atomically
        run: |
          git push --atomic origin --delete \
            ability/dash \
            ability/npc-grant-action \
            acceptance/ui-budget-overflow-55 \
            cursor/moss-crab-atlas-fix-3441 \
            fix/character-pack-complete \
            fix/move-playback-speed-sync \
            fix/rustfmt-baseline \
            forge/mob-lab \
            forge/mob-lab-m2-1 \
            forge/mob-lab-m3 \
            forge/mob-lab-m4 \
            forge/mob-lab-v01 \
            hub/character-lab-launch \
            hub/dashboard-stop-server \
            hub-0.4 \
            hub-0.5 \
            integration/latest-character-lab-master \
            integration/m4-character-lab-master \
            merge/character-lab-into-m4 \
            small-fixes \
            text/production-foundation \
            ui/alpha-frontend-background-motion \
            ui/game-settings-window

