name: Temporary UI Font Upgrade
on:
  push:
    branches: [ui/equipment-drag-drop]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install readable UI font
        run: |
          set -euo pipefail
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf apps/client/assets/fonts/DejaVuSans-Bold.ttf
          cp /usr/share/doc/fonts-dejavu-core/copyright apps/client/assets/fonts/DejaVuSans-LICENSE.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/client/src/assets.rs')
          s=p.read_text()
          old='pub const UI_FONT: &[u8] = include_bytes!("../assets/fonts/Hack-Regular.ttf");'
          new='pub const UI_FONT: &[u8] = include_bytes!("../assets/fonts/DejaVuSans-Bold.ttf");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          p=Path('apps/client/src/ui_panel.rs')
          s=p.read_text()
          changes={
            'const CURRENCY_FONT_SIZE_UNITS: f32 = 11.0;':'const CURRENCY_FONT_SIZE_UNITS: f32 = 12.0;',
            'const INVENTORY_QUANTITY_FONT_SIZE_UNITS: f32 = 11.0;':'const INVENTORY_QUANTITY_FONT_SIZE_UNITS: f32 = 12.0;',
            'const INVENTORY_TOOLTIP_FONT_SIZE_UNITS: f32 = 11.0;':'const INVENTORY_TOOLTIP_FONT_SIZE_UNITS: f32 = 13.0;',
            'const INVENTORY_TOOLTIP_HEIGHT_UNITS: f32 = 48.0;':'const INVENTORY_TOOLTIP_HEIGHT_UNITS: f32 = 54.0;',
          }
          for old,new in changes.items():
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Check client
        run: cargo check -p purgatory-client
      - name: Test inventory UI
        run: cargo test -p purgatory-client inventory_item_hover_tooltip_and_click_selection_share_visible_slot_mapping
      - name: Commit clean patch
        run: |
          rm .github/workflows/temporary-ui-font-upgrade.yml
          git config user.name "purgatory-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client/assets/fonts/DejaVuSans-Bold.ttf apps/client/assets/fonts/DejaVuSans-LICENSE.txt apps/client/src/assets.rs apps/client/src/ui_panel.rs .github/workflows/temporary-ui-font-upgrade.yml
          git commit -m "Improve UI text readability"
          git push origin HEAD:ui/equipment-drag-drop
