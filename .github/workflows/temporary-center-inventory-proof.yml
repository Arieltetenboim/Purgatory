name: Temporary Center Inventory Proof

on:
  push:
    branches:
      - ui/inventory-tabs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Center proof drops
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/server/src/network/gameplay.rs')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('("equipment.debug.practice_sword", 1, -0.75)', '("equipment.debug.practice_sword", 1, -2.5)'),
              ('("item.debug.small_potion", 3, -2.0)', '("item.debug.small_potion", 3, -1.25)'),
              ('("item.debug.iron_scrap", 7, -3.25)', '("item.debug.iron_scrap", 7, 0.0)'),
              ('("item.debug.repair_hammer", 1, -4.5)', '("item.debug.repair_hammer", 1, 1.25)'),
              ('("item.package", 1, -5.75)', '("item.package", 1, 2.5)'),
              ('[position[0] + x_offset, position[1] + 0.75]', '[x_offset, position[1] + 0.75]'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "apps/server/src/network/gameplay.rs"

      - name: Check server
        run: cargo check -p purgatory-server

      - name: Commit clean patch
        run: |
          rm .github/workflows/temporary-center-inventory-proof.yml
          git diff --check
          git config user.name "purgatory-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/network/gameplay.rs .github/workflows/temporary-center-inventory-proof.yml
          git commit -m "Center inventory proof drops"
          git push origin HEAD:ui/inventory-tabs
