name: Temporary UI chrome polish

on:
  push:
    branches:
      - ui/equipment-drag-drop

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/equipment-drag-drop
          fetch-depth: 0
      - name: Apply focused UI polish
        run: python3 .github/ui_polish_once.py
      - name: Format touched Rust
        run: rustfmt --edition 2024 apps/client/src/ui_panel.rs
      - name: Client tests
        run: cargo test -p purgatory-client
      - name: Client check
        run: cargo check -p purgatory-client
      - name: Diff check
        run: git diff --check
      - name: Commit verified polish and remove temporary automation
        run: |
          rm .github/ui_polish_once.py
          rm .github/workflows/ui-polish-once.yml
          git config user.name "PURGATORY UI Polish"
          git config user.email "actions@users.noreply.github.com"
          git add apps/client/src/ui_panel.rs Graphic/ui/ATLAS.ui.json Graphic/ui/inventory_tab.ui.json .github/ui_polish_once.py .github/workflows/ui-polish-once.yml
          git commit -m "Polish UI chrome geometry"
          git push origin HEAD:ui/equipment-drag-drop
