name: Temporary UI repair

on:
  push:
    branches: [ "ui/equipment-drag-drop" ]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair UI composition and modal layering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/equipment-drag-drop
          fetch-depth: 0

      - name: Apply focused UI repair
        run: python3 .github/ui_repair_once.py

      - name: Format touched Rust files
        run: rustfmt --edition 2024 apps/client/src/asset_runtime.rs apps/client/src/ui_panel.rs apps/client/src/app.rs

      - name: Client tests
        run: cargo test -p purgatory-client

      - name: Client check
        run: cargo check -p purgatory-client

      - name: Diff check
        run: git diff --check

      - name: Commit verified repair and remove temporary automation
        run: |
          git config user.name "PURGATORY UI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/client/src/asset_runtime.rs apps/client/src/ui_panel.rs apps/client/src/app.rs apps/client/src/renderer/shaders/ui_texture.wgsl Graphic/ui/ATLAS.ui.json Graphic/ui/inventory_tab.ui.json Graphic/ui/inventory_slot.ui.json
          git rm .github/ui_repair_once.py .github/workflows/ui-repair-once.yml
          git commit -m "Repair UI composition and modal layering"
          git push origin HEAD:ui/equipment-drag-drop
