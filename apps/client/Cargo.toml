[package]
name = "purgatory-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native PURGATORY client."

[[bin]]
name = "purgatory-client"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.1"
egui-wgpu = { version = "0.36.1", features = ["winit"] }
egui-winit = "0.36.1"
pollster = "0.4.0"
purgatory-common = { path = "../../crates/common" }
purgatory-content = { path = "../../crates/content" }
purgatory-protocol = { path = "../../crates/protocol" }
purgatory-simulation = { path = "../../crates/simulation" }
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "30.0.1"
winit = "0.30.13"

[lints]
workspace = true
