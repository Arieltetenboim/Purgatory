[package]
name = "purgatory-bot-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless load-test bot client."
autobins = false

[lib]
name = "purgatory_bot_client"
path = "src/lib.rs"

[[bin]]
name = "purgatory-load"
path = "src/main.rs"

[[bin]]
name = "purgatory-bot-client"
path = "src/bin/purgatory_bot_client.rs"

[dependencies]
purgatory-common = { path = "../../crates/common" }
purgatory-protocol = { path = "../../crates/protocol" }
purgatory-simulation = { path = "../../crates/simulation" }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ctrlc = "3"

[lints]
workspace = true
